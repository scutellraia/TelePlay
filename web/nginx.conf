server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip settings
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # Upload hub (/up) - large uploads, no request buffering
    location /up {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        client_max_body_size 0;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API proxy
    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # AriaNg GUI (single-file build served statically)
    location = /aria2 {
        return 301 /aria2/;
    }

    location ^~ /aria2/ {
        alias /usr/share/nginx/html/aria2/;
        index index.html;
    }

    # mldonkey Web UI（ed2k 下载器）
    location = /mldonkey {
        return 301 /mldonkey/;
    }

    location ^~ /mldonkey/ {
        auth_basic "mldonkey";
        auth_basic_user_file /etc/nginx/.mldonkey.htpasswd;
        # 不要把浏览器的 Basic 凭证转给 mldonkey：它有自己的 users.ini 认证，
        # 会因为拿不到 mld 用户而回 401 登录页
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_pass http://mldonkey:4080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Prefix /mldonkey;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # aria2 JSON-RPC proxy used by AriaNg
    location = /jsonrpc {
        proxy_pass http://aria2:6800/jsonrpc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }

    # SPA routing - serve index.html for all routes
    # HTML 不缓存：新构建后浏览器立刻拿到新的 asset 名
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
