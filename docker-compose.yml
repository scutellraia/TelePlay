# =========================================
# TelePlay - Docker Compose
# =========================================
#
# Usage:
#   1. Copy .env.example to .env and fill in your values
#   2. Run: docker-compose up -d
#
# Services:
#   - db: PostgreSQL database
#   - backend: FastAPI + Telegram Bot
#   - web: React web interface (nginx)
#
# =========================================

services:
  # -----------------------------------------
  # PostgreSQL Database
  # -----------------------------------------
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-telegram_tv}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - telegram-tv-network

  # -----------------------------------------
  # Backend API + Telegram Bot
  # -----------------------------------------
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-telegram_tv}

      # Redis (Optional - Currently unused)
      # REDIS_URL: redis://redis:6379

      # Telegram (from .env file)
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_STORAGE_CHANNEL_ID: ${TELEGRAM_STORAGE_CHANNEL_ID}

      # Security
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-10080}

      # Web URL
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost}

      # Upload hub (/up)
      ARIA2_RPC_URL: http://aria2:6800/jsonrpc
      ARIA2_RPC_SECRET: ${ARIA2_RPC_SECRET:-teleplay}
      UP_HOOK_SECRET: ${UP_HOOK_SECRET:-teleplay-hook}
      ARIA2_RECONCILE_SECONDS: ${ARIA2_RECONCILE_SECONDS:-300}
      DOWNLOAD_DIR: /downloads
      UPLOAD_TMP_DIR: /tmp/tp-uploads
      UP_STATE_FILE: /app/session/up-state.json
      UP_STATUS_FILE: /app/status/status.json
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Persist Telegram session files only (do not mount over /app — that hides rebuilt code)
      - telegram_session:/app/session
      - downloads:/downloads
      - /home/ubuntu/tp-status:/app/status:ro
      - upload_tmp:/tmp/tp-uploads
    networks:
      - telegram-tv-network

  # -----------------------------------------
  # aria2 (BT downloads, JSON-RPC only, no GUI)
  # Pushes a completion event to the backend via on-complete.sh
  # -----------------------------------------
  aria2:
    build: ./aria2
    restart: unless-stopped
    environment:
      RPC_SECRET: ${ARIA2_RPC_SECRET:-teleplay}
      UP_HOOK_SECRET: ${UP_HOOK_SECRET:-teleplay-hook}
      UP_BACKEND_URL: http://backend:8000
      TZ: Asia/Shanghai
    volumes:
      - aria2_config:/config
      - downloads:/downloads
    networks:
      - telegram-tv-network

  # -----------------------------------------
  # Web Interface (React + Nginx)
  # -----------------------------------------
  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - telegram-tv-network

# -----------------------------------------
# Volumes
# -----------------------------------------
volumes:
  upload_tmp:
  postgres_data:
    driver: local
  telegram_session:
    driver: local
  aria2_config:
    driver: local
  downloads:
    driver: local

# -----------------------------------------
# Networks
# -----------------------------------------
networks:
  telegram-tv-network:
    driver: bridge
