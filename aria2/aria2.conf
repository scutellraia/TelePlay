# aria2 configuration for the TelePlay upload hub.
# No GUI: only the JSON-RPC interface is exposed on the compose network.

dir=/downloads
continue=true

enable-rpc=true
rpc-listen-all=true
rpc-allow-origin-all=true
rpc-listen-port=6800

file-allocation=none
max-concurrent-downloads=5
max-connection-per-server=16
split=16
min-split-size=1M

bt-enable-lpd=true
enable-dht=true
bt-max-peers=128
follow-torrent=true
seed-time=0

on-download-complete=/usr/local/bin/on-complete.sh
on-download-error=/usr/local/bin/on-complete.sh

save-session=/config/aria2.session
input-file=/config/aria2.session
save-session-interval=30

log=/config/aria2.log
log-level=warn

# Public trackers: bare info hashes have none of their own, and DHT alone is
# too slow from a datacenter IP.
bt-tracker=udp://tracker.opentrackr.org:1337/announce,udp://open.demonii.com:1337/announce,udp://tracker.openbittorrent.com:6969/announce,udp://exodus.desync.com:6969/announce,udp://tracker.torrent.eu.org:451/announce,udp://open.stealth.si:80/announce,udp://tracker.dler.org:6969/announce,udp://explodie.org:6969/announce,udp://tracker1.bt.moack.co.kr:80/announce,https://tracker.tamersunion.org:443/announce
